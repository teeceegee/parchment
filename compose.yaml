services:
  parchment:
    build: .
    image: parchment:dev
    container_name: parchment
    restart: unless-stopped
    ports:
      - "8090:8080"
    volumes:
      - ./public:/app/public:ro
      - ./server.js:/app/server.js:ro
      - ./cache:/app/cache
    environment:
      HOST: 0.0.0.0
      PORT: 8080
    env_file:
      - path: .env
        required: false
      - path: weather.env
        required: false
      - path: cameras.env
        required: false
