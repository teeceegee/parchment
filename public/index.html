<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f1e8" />
    <title>Parchment Calendar</title>
    <link rel="stylesheet" href="/styles.css?v=20260918-weather6" />
  </head>
  <body>
    <main class="dashboard">
      <section class="calendar-panel">
        <header class="calendar-toolbar">
          <nav class="view-switcher" aria-label="Calendar view">
            <button class="view-button active" data-view="agenda">Today</button>
            <button class="view-button" data-view="day">Day</button>
            <button class="view-button" data-view="week">Week</button>
            <button class="view-button" data-view="month">Month</button>
          </nav>
          <div class="clock" id="clock" role="button" tabindex="0" aria-label="Refresh calendar and weather">
            <span id="date" aria-label="Current date"><span>Loading…</span><span></span><span></span></span>
            <span id="time">--:--</span>
          </div>
        </header>

        <section class="content">
        <div class="section-heading">
          <button class="round-button" id="previous" aria-label="Previous day">‹</button>
          <div>
            <p class="eyebrow" id="range-label">TODAY</p>
            <h2 id="heading">Today</h2>
          </div>
          <button class="round-button" id="next" aria-label="Next day">›</button>
        </div>

        <div class="legend" id="legend" aria-label="Calendars"></div>
        <div class="events" id="events" aria-live="polite"></div>
        <p class="status" id="status">Connecting…</p>
        </section>
      </section>

      <aside class="side-panel">
        <section class="weather-card" aria-label="Weather forecast">
          <div class="panel-heading"><div><p class="eyebrow">WEST ALLOTMENT <span id="weather-period">· NOW</span></p></div><span class="panel-icon" id="weather-icon" aria-hidden="true"></span></div>
          <div id="weather" class="weather-content"><p class="panel-placeholder">Loading weather…</p></div>
        </section>
        <section class="photo-card" aria-labelledby="photo-heading">
          <div class="panel-heading"><div><p class="eyebrow">NATIONAL GEOGRAPHIC</p><h2 id="photo-heading">Photo of the day</h2></div></div>
          <div id="photo" class="photo-content"><p class="panel-placeholder">Loading today’s photograph…</p></div>
        </section>
      </aside>
    </main>
    <script type="module" src="/app.js?v=20260918-weather6"></script>
  </body>
</html>
